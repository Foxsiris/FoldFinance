<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новая операция — внешний экран</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#08080A}
a{color:#F5F5F3}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 400px; height: 640px; box-sizing: border-box; background: #08080A; color: #F5F5F3; font-family: 'Onest', system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 36px 20px 12px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex: none">
    <a href="Main.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 22px; background: #151518; color: #F5F5F3; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span style="font-size: 16px; font-weight: 600">Новая операция</span>
    <span style="width: 44px" aria-hidden="true"></span>
  </div>

  <div role="group" aria-label="Тип операции" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #131316; border-radius: 14px; padding: 4px; height: 42px; box-sizing: border-box; flex: none">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="border: none; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font-size: 13.5px; font-weight: 500">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="height: 80px; display: flex; align-items: center; justify-content: center; gap: 8px; flex: none">
    <span style="font-size: 56px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; color: {{amountColor}}">{{display}}</span>
    <span style="width: 2px; height: 44px; border-radius: 1px; background: {{accent}}"></span>
    <span style="font-size: 32px; font-weight: 500; color: #6E6E76">₽</span>
  </div>

  <div style="display: flex; gap: 8px; justify-content: center; flex: none">
    <button style="height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #2A2A30; background: none; color: #D6D6DA; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"></rect><path d="M2.5 10h19"></path></svg>*1234</button>
    <button style="height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #2A2A30; background: none; color: #D6D6DA; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Сегодня, 14:20</button>
    <button style="height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid #2A2A30; background: none; color: #D6D6DA; font-size: 13px">Заметка</button>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto; flex: none; margin: 0 -20px; padding: 0 20px; scrollbar-width: none">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: none; height: 40px; padding: 0 14px; border-radius: 14px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.color}}"></span>{{c.label}}</button>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: auto; flex: none">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 48px; border: none; border-radius: 16px; background: #131316; color: #F5F5F3; font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center; padding: 0">
        <sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="m12 9.5 5 5M17 9.5l-5 5"></path></svg></sc-if>
        <sc-if value="{{k.isChar}}" hint-placeholder-val="{{true}}">{{k.label}}</sc-if>
      </button>
    </sc-for>
  </div>

  <button style="height: 54px; flex: none; border: none; border-radius: 18px; background: {{saveBg}}; color: {{saveFg}}; font-size: 16px; font-weight: 600">{{saveLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2F65A","options":["#D2F65A","#A9C8FF","#FFB38A","#8EF0C8"]},"$preview":{"width":400,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { raw: '1250', type: 0, cat: 0 };
  }
  fmt(raw) {
    if (!raw) return '0';
    const parts = raw.split(',');
    const int = (parts[0] || '0').replace(/^0+(?=\d)/, '');
    const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.length > 1 ? grouped + ',' + parts[1] : grouped;
  }
  press(ch) {
    let raw = this.state.raw;
    if (ch === 'back') raw = raw.slice(0, -1);
    else if (ch === ',') { if (!raw.includes(',')) raw = (raw || '0') + ','; }
    else {
      const dec = raw.split(',')[1];
      if (dec !== undefined && dec.length >= 2) return;
      if (!raw.includes(',') && raw.replace(/\D/g, '').length >= 9) return;
      raw = raw === '0' ? ch : raw + ch;
    }
    this.setState({ raw });
  }
  renderVals() {
    const accent = this.props.accent ?? '#D2F65A';
    const typeLabels = ['Расход', 'Доход', 'Перевод'];
    const types = typeLabels.map((label, i) => ({
      label,
      pressed: i === this.state.type ? 'true' : 'false',
      bg: i === this.state.type ? '#26262C' : 'transparent',
      fg: i === this.state.type ? '#F5F5F3' : '#A1A1A8',
      pick: () => this.setState({ type: i })
    }));
    const catDefs = [
      ['Продукты', '#9BDB6A'], ['Рестораны', '#FF9B73'], ['Транспорт', '#6AA8FF'],
      ['Покупки', '#E8B07A'], ['Подписки', '#B49BFF'], ['Здоровье', '#F0EDE6'], ['Другое', '#8A8A92']
    ];
    const cats = catDefs.map(([label, color], i) => {
      const on = i === this.state.cat;
      return {
        label, color,
        pressed: on ? 'true' : 'false',
        bg: on ? accent + '24' : '#131316',
        border: on ? accent + '66' : '#131316',
        fg: on ? '#F5F5F3' : '#D6D6DA',
        pick: () => this.setState({ cat: i })
      };
    });
    const keyDefs = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'back'];
    const keys = keyDefs.map((k) => ({
      label: k,
      aria: k === 'back' ? 'Стереть' : k,
      isBack: k === 'back',
      isChar: k !== 'back',
      press: () => this.press(k)
    }));
    const display = this.fmt(this.state.raw);
    const empty = !this.state.raw || /^0*,?0*$/.test(this.state.raw);
    return {
      accent,
      types,
      cats,
      keys,
      display,
      amountColor: empty ? '#4A4A52' : '#F5F5F3',
      saveBg: empty ? '#1C1C20' : accent,
      saveFg: empty ? '#6E6E76' : '#0B0B0C',
      saveLabel: empty ? 'Введите сумму' : 'Сохранить · ' + display + ' ₽'
    };
  }
}
</script>
</body>
</html>
